---
driver:
  name: exec
transport:
  name: exec

provisioner:
  name: chef_zero
  product_name: cinc
  policyfile: Policyfile.rb
  multiple_converge: 2
  enforce_idempotency: true
  deprecations_as_errors: true

verifier:
  name: inspec

platforms:
  - name: <%= ENV.fetch('WINDOWS_PLATFORM', 'windows-2025') %>

suites:
  - name: default
    provisioner:
      named_run_list: default
    verifier:
      inspec_tests: [test/integration/default]
  - name: internet-printing
    provisioner:
      named_run_list: internet_printing
    verifier:
      inspec_tests: [test/integration/internet_printing]
  - name: lpd-service
    provisioner:
      named_run_list: lpd_service
    verifier:
      inspec_tests: [test/integration/lpd_service]
  - name: resources
    provisioner:
      named_run_list: <%= ENV.fetch('PRINT_TEST_ACTION', 'resources') %>
    verifier:
      inspec_tests: ["test/integration/<%= ENV.fetch('PRINT_TEST_ACTION', 'resources') %>"]
