---
name: ci

"on":
  pull_request:
  push:
    branches: [main, codex/windows-print-resources]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  windows:
    needs: lint-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        suite: [default, internet-printing, lpd-service, resources]
    env:
      CHEF_LICENSE: accept-no-persist
      WINDOWS_PLATFORM: ${{ matrix.os }}
      TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Cinc Workstation
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-cinc.ps1'
          Invoke-WebRequest -Uri 'https://omnitruck.cinc.sh/install.ps1' -OutFile $installer -ErrorAction Stop
          . $installer
          install -project cinc-workstation -version latest
          "$env:SystemDrive\cinc-project\cinc-workstation\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Policyfile
        run: chef install Policyfile.rb
      - name: Test printing and idempotency
        shell: pwsh
        run: |
          $instance = "$env:TEST_SUITE-$env:WINDOWS_PLATFORM"
          kitchen converge $instance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kitchen verify $instance --log-level debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TEST_SUITE -eq 'resources') {
            foreach ($action in @('update', 'delete')) {
              $env:PRINT_TEST_ACTION = $action
              kitchen converge $instance
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              kitchen verify $instance --test-base-path test/lifecycle
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          kitchen destroy $instance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Kitchen diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kitchen-${{ matrix.os }}-${{ matrix.suite }}
          path: .kitchen/logs/
          if-no-files-found: ignore
