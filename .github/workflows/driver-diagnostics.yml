---
name: native driver diagnostics

"on":
  push:
    branches: [codex/windows-print-resources]

jobs:
  driver:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        mode: [default, local]
    steps:
      - name: Check literal driver removal with local server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-WindowsFeature Print-Server -ErrorAction Stop
          $name = 'Generic / Text Only'
          Add-PrinterDriver -Name $name -PrinterEnvironment 'Windows x64' -ErrorAction Stop
          Add-PrinterPort -Name 'Kitchen driver diagnostic' -PrinterHostAddress '192.0.2.10'
          Add-Printer -Name 'Kitchen driver [1]' -DriverName $name -PortName 'Kitchen driver diagnostic'
          $queue = Get-Printer -ErrorAction Stop | Where-Object Name -eq 'Kitchen driver [1]'
          Remove-Printer -InputObject $queue -ErrorAction Stop
          $mode = '${{ matrix.mode }}'
          if ($mode -eq 'local') {
            $target = Get-PrinterDriver -ComputerName $env:COMPUTERNAME -ErrorAction Stop | Where-Object Name -eq $name
          } else {
            $target = Get-PrinterDriver -ErrorAction Stop | Where-Object Name -eq $name
          }
          Write-Output "Selected object server: [$($target.ComputerName)]"
          try {
            Remove-PrinterDriver -InputObject $target -ErrorAction Stop
            if ($null -ne (Get-PrinterDriver -ErrorAction Stop | Where-Object Name -eq $name)) {
              throw 'Driver still present after deletion'
            }
            Write-Output "$mode removal verified"
          } catch {
            $_ | Format-List * -Force
            throw
          }
