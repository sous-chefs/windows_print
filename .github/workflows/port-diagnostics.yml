---
name: native port diagnostics

"on":
  push:
    branches: [codex/windows-print-resources]

jobs:
  port:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Verify explicit local-server port removal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-WindowsFeature Print-Server -ErrorAction Stop
          $name = 'Kitchen diagnostic [1]'
          Add-PrinterPort -Name $name -PrinterHostAddress '192.0.2.10'
          $target = Get-PrinterPort | Where-Object Name -eq $name
          Write-Output "Default object server: [$($target.ComputerName)]"
          try {
            Remove-PrinterPort -InputObject $target -ErrorAction Stop
            Write-Output 'Default object deletion succeeded'
          } catch {
            Write-Output "Default object deletion failed: $_"
          }
          if ($null -eq (Get-PrinterPort | Where-Object Name -eq $name)) {
            Add-PrinterPort -Name $name -PrinterHostAddress '192.0.2.10'
          }
          $target = Get-PrinterPort -ComputerName $env:COMPUTERNAME | Where-Object Name -eq $name
          Write-Output "Explicit object server: [$($target.ComputerName)]"
          Remove-PrinterPort -InputObject $target -ErrorAction Stop
          if ($null -ne (Get-PrinterPort | Where-Object Name -eq $name)) {
            throw 'Explicit local-server port removal did not remove the target'
          }
          Write-Output 'Explicit local-server port removal verified'
