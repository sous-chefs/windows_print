---
name: native argument diagnostics

"on":
  push:
    branches: [codex/windows-print-resources]

jobs:
  script-host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Record harmless host-option arguments
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'arguments.vbs'
          $source = @'
          Set fs = CreateObject("Scripting.FileSystemObject")
          Set output = fs.CreateTextFile(WScript.Arguments(0), True, True)
          For i = 1 To WScript.Arguments.Count - 1
            output.WriteLine WScript.Arguments(i)
          Next
          output.Close
          '@
          Set-Content -LiteralPath $script -Value $source -Encoding ascii
          $cases = @('//B', '"//B"', '/B', '"/B"', '"-r"')
          for ($i = 0; $i -lt $cases.Count; $i++) {
            $output = Join-Path $env:RUNNER_TEMP "arguments-$i.txt"
            $arguments = '//B //NoLogo "' + $script + '" "' + $output + '" ' + $cases[$i]
            $process = Start-Process -FilePath "$env:SystemRoot\System32\cscript.exe" -ArgumentList $arguments -NoNewWindow -PassThru
            if (-not $process.WaitForExit(15000)) { $process.Kill(); throw 'Recorder timed out' }
            $values = @(Get-Content -LiteralPath $output)
            Write-Output "Argument $($cases[$i]): count=$($values.Count); data=$($values | ConvertTo-Json -Compress)"
          }
